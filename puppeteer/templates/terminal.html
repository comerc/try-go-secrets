<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Go Secret</title>
  <style>
    @font-face {
      font-family: 'FiraCode';
      src: url('/static/fonts/FiraCode-Regular.ttf') format('truetype');
      font-weight: 400;
    }

    @font-face {
      font-family: 'FiraCode';
      src: url('/static/fonts/FiraCode-Medium.ttf') format('truetype');
      font-weight: 500;
    }

    @font-face {
      font-family: 'Roboto';
      src: url('/static/fonts/Roboto-Regular.ttf') format('truetype');
      font-weight: 400;
    }

    @font-face {
      font-family: 'Roboto';
      src: url('/static/fonts/Roboto-Bold.ttf') format('truetype');
      font-weight: 700;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d1117;
      width: 1080px;
      height: 1920px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Terminal ── */
    .terminal-wrapper {
      width: 960px;
      margin-top: 60px;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .terminal-window {
      background: #161b22;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #30363d;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .terminal-header {
      background: #21262d;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #30363d;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .dot-red {
      background: #ff5f57;
    }

    .dot-yellow {
      background: #febc2e;
    }

    .dot-green {
      background: #28c840;
    }

    .terminal-title {
      color: #8b949e;
      font-size: 14px;
      margin-left: 8px;
      font-family: 'FiraCode', monospace;
    }

    .terminal-body {
      padding: 20px 0;
    }

    /* Line numbers + code table */
    .code-table {
      width: 100%;
      border-collapse: collapse;
    }

    .line-num {
      color: #484f58;
      font-size: 32px;
      line-height: 1.65;
      font-family: 'FiraCode', monospace;
      font-weight: 400;
      text-align: right;
      padding: 0 14px 0 20px;
      user-select: none;
      width: 56px;
      vertical-align: top;
      white-space: nowrap;
    }

    .line-code {
      color: #abb2bf;
      font-size: 32px;
      line-height: 1.65;
      font-family: 'FiraCode', monospace;
      font-weight: 400;
      font-feature-settings: "calt" 1, "liga" 1;
      padding-right: 20px;
      vertical-align: top;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* highlight.js atom-one-dark theme */
    .hljs-comment,
    .hljs-quote {
      color: #7ec89a;
      /* font-style: italic; */
    }

    .hljs-doctag,
    .hljs-keyword,
    .hljs-formula {
      color: #c678dd;
    }

    .hljs-section,
    .hljs-name,
    .hljs-selector-tag,
    .hljs-deletion,
    .hljs-subst {
      color: #e06c75;
    }

    .hljs-literal {
      color: #56b6c2;
    }

    .hljs-string,
    .hljs-regexp,
    .hljs-addition,
    .hljs-attribute,
    .hljs-meta .hljs-string {
      color: #98c379;
    }

    .hljs-attr,
    .hljs-variable,
    .hljs-template-variable,
    .hljs-type,
    .hljs-selector-class,
    .hljs-selector-attr,
    .hljs-selector-pseudo,
    .hljs-number {
      color: #d19a66;
    }

    .hljs-symbol,
    .hljs-bullet,
    .hljs-link,
    .hljs-meta,
    .hljs-selector-id,
    .hljs-title {
      color: #61aaff;
    }

    .hljs-built_in,
    .hljs-title.class_,
    .hljs-class .hljs-title {
      color: #e6c07b;
    }

    .hljs-emphasis {
      font-style: italic;
    }

    .hljs-strong {
      font-weight: bold;
    }

    /* Cursor */
    .cursor {
      display: inline-block;
      width: 3px;
      height: 1.2em;
      background: #58a6ff;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
      margin-left: 2px;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    .go-badge {
      color: #58a6ff;
      font-size: 18px;
      font-family: 'FiraCode', monospace;
      opacity: 0.6;
      text-align: right;
      padding-top: 8px;
    }

    /* ── Subtitles — прикреплены к низу, терминал наслаивается сверху ── */
    .subtitle-area {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 1080px;
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 60px 80px;
      z-index: 1;
    }

    .subtitle-text {
      font-family: 'Roboto', sans-serif;
      font-size: 56px;
      font-weight: 400;
      line-height: 1.35;
      text-align: center;
      word-break: break-word;
    }

    .word-spoken {
      color: #9aa3b2;
      -webkit-text-stroke: 2px #000;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
    }

    .word-current {
      color: #ffffff;
      -webkit-text-stroke: 2px #000;
      text-shadow:
        0 0 12px rgba(88, 166, 255, 0.9),
        2px 2px 6px rgba(0, 0, 0, 0.9);
    }

    .word-future {
      color: #c8d0df;
      -webkit-text-stroke: 2px #000;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>

<body>
  <div class="terminal-wrapper">
    <div class="terminal-window">
      <div class="terminal-header">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
        <span class="terminal-title"></span>
      </div>
      <div class="terminal-body">
        <table class="code-table">
          <tbody id="code-lines"></tbody>
        </table>
      </div>
    </div>
    <!-- <div class="go-badge">// Go Secrets</div> -->
  </div>

  <div class="subtitle-area">
    <div class="subtitle-text" id="subtitle-text"></div>
  </div>

  <script src="/static/js/highlight.min.js"></script>
  <script>
    function updateCode(code, lang) {
      code = code.replace(/\t/g, '    ');
      const lines = code.split('\n');
      const tbody = document.getElementById('code-lines');
      tbody.innerHTML = '';

      let highlighted;
      try {
        highlighted = hljs.highlight(code, { language: lang || 'go', ignoreIllegals: true }).value;
      } catch (e) {
        highlighted = hljs.highlightAuto(code).value;
      }

      // Split highlighted HTML by newlines (preserving spans across lines is tricky;
      // we re-highlight per-line to avoid broken tags)
      lines.forEach(function (lineText, i) {
        var hlLine;
        try {
          hlLine = hljs.highlight(lineText, { language: lang || 'go', ignoreIllegals: true }).value;
        } catch (e) {
          hlLine = lineText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        var tr = document.createElement('tr');

        var numTd = document.createElement('td');
        numTd.className = 'line-num';
        numTd.textContent = i + 1;

        var codeTd = document.createElement('td');
        codeTd.className = 'line-code';
        codeTd.innerHTML = hlLine;

        if (i === lines.length - 1) {
          var cursor = document.createElement('span');
          cursor.className = 'cursor';
          codeTd.appendChild(cursor);
        }

        tr.appendChild(numTd);
        tr.appendChild(codeTd);
        tbody.appendChild(tr);
      });
    }

    function updateSubtitle(words, currentIdx) {
      var container = document.getElementById('subtitle-text');
      if (!words || words.length === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = words.map(function (w, i) {
        var cls;
        if (i < currentIdx) cls = 'word-spoken';
        else if (i === currentIdx) cls = 'word-current';
        else cls = 'word-future';
        return '<span class="' + cls + '">' + w + ' </span>';
      }).join('');
    }
  </script>
</body>

</html>
