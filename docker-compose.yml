services:
  puppeteer:
    build:
      context: .
      dockerfile: docker/Dockerfile.puppeteer
    ports:
      - "3333:3333"
    environment:
      PORT: 3333
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./output:/app/output

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      puppeteer:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PUPPETEER_URL: http://puppeteer:3333
    volumes:
      - ./raw:/app/raw:ro
      - ./output:/app/output
      - ./state:/app/state
